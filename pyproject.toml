[project]
name = "chinchilla"
version = "0.1.0"
description = "Select part of the screen, ask a vision model about it"
requires-python = ">=3.10"
dependencies = ["pillow>=10.0", "httpx>=0.27"]

[project.scripts]
chinchilla = "chinchilla.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chinchilla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
